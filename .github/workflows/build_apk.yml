name: Build Android APK

# بناء يدوي فقط: يشتغل لما تضغط "Run workflow" من تبويب Actions.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Generate missing Android scaffold files (gradlew, icons)
        # هذا المستودع يحتفظ فقط بالملفات المخصصة (build.gradle,
        # AndroidManifest.xml, MainActivity.kt). سكربت Gradle wrapper
        # وأيقونات التطبيق الافتراضية مش موجودين، فبننشئهم في مشروع
        # مؤقت منفصل وننسخهم بس — من غير ما نلمس lib/ أو pubspec.yaml
        # أو ملفات android/app المخصصة عندنا.
        run: |
          flutter create --platforms=android --org com.example --project-name earth_to_moon_learning_game /tmp/scaffold
          cp /tmp/scaffold/android/gradlew android/gradlew
          cp /tmp/scaffold/android/gradlew.bat android/gradlew.bat
          cp -r /tmp/scaffold/android/gradle/wrapper/. android/gradle/wrapper/
          mkdir -p android/app/src/main/res
          cp -r /tmp/scaffold/android/app/src/main/res/. android/app/src/main/res/
          chmod +x android/gradlew

      - name: Set up release signing (falls back to the test key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # لو الـ secrets ناقصة أو الـ keystore تالف، نكمل بمفتاح debug
          # بدل ما يفشل البناء كله (build.gradle يتعامل مع غياب key.properties).
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] \
             && echo "$KS_B64" | base64 -d > android/upload-keystore.jks 2>/dev/null \
             && keytool -list -keystore android/upload-keystore.jks \
                  -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
              "$KS_PASS" "${KEY_PASS:-$KS_PASS}" "$KEY_ALIAS" > android/key.properties
            echo "Using release keystore from secrets."
          else
            # مفتاح تجريبي ثابت موجود في المستودع: كل البناءات بنفس التوقيع
            # فيمكن تثبيت النسخة الجديدة فوق القديمة. للتجربة فقط.
            rm -f android/upload-keystore.jks
            printf 'storePassword=android\nkeyPassword=android\nkeyAlias=testkey\nstoreFile=../test-keystore.jks\n' > android/key.properties
            echo "::warning::Signing secrets missing or invalid; signing with the repo's test key."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-moon-release
          path: build/app/outputs/flutter-apk/app-release.apk
